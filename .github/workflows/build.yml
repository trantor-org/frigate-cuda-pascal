name: Build and Push

on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    # Rebuild weekly on Sundays to pick up upstream frigate:stable updates
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      frigate_version:
        description: 'Upstream Frigate tag (e.g. stable, 0.15.0)'
        required: false
        default: 'stable'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=stable,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set Frigate version
        id: frigate_ver
        run: |
          VER=${{ github.event.inputs.frigate_version || 'stable' }}
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FRIGATE_VERSION=${{ steps.frigate_ver.outputs.version }}

  # A merge here moves nothing in unraid: the frigate gitlink is only bumped by trantor's freeze-SHA engine.
  # Dispatch the built SHA after Build and Push publishes the image on main so the bump PR opens now instead of waiting on the
  # next */15 tick.
  dispatch:
    name: dispatch
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      # The workspace App token, not GITHUB_TOKEN: a dispatch sent with GITHUB_TOKEN
      # reaches only this repository.
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.WORKSPACE_APP_CLIENT_ID }}
          private-key: ${{ secrets.WORKSPACE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: trantor
          permission-contents: write
      - name: Dispatch the green SHA to trantor
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GREEN_SHA: ${{ github.sha }}
        run: |
          gh api repos/trantor-org/trantor/dispatches \
            -f event_type=frigate-green \
            -f "client_payload[sha]=$GREEN_SHA" \
            -f "client_payload[gitlink]=domains/unraid/frigate"
