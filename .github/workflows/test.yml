name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      # Pinned by SHA rather than tag so a moved tag cannot change what runs.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      # Unit tests only: the Frigate-only modules are stubbed, so no GPU, image or live deployment is involved.
      - name: Pytest
        run: uv run --group dev pytest

  # A merge here moves nothing in unraid: the frigate gitlink is only bumped by trantor's freeze-SHA engine.
  # Dispatch the tested SHA after Test succeeds on main so the bump PR opens now instead of waiting on the
  # next */15 tick.
  dispatch:
    name: dispatch
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      # The workspace App token, not GITHUB_TOKEN: a dispatch sent with GITHUB_TOKEN
      # reaches only this repository.
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.WORKSPACE_APP_CLIENT_ID }}
          private-key: ${{ secrets.WORKSPACE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: trantor
          permission-contents: write
      - name: Dispatch the green SHA to trantor
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GREEN_SHA: ${{ github.sha }}
        run: |
          gh api repos/trantor-org/trantor/dispatches \
            -f event_type=frigate-green \
            -f "client_payload[sha]=$GREEN_SHA" \
            -f "client_payload[gitlink]=domains/unraid/frigate"
